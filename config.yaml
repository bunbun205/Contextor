corpus:
  name: "corpus_a"
  path: "./data/corpus_a"

chunking:
  chunk_size: 800
  chunk_overlap: 120

embedding:
  provider: "sentence-transformers"
  model: "all-MiniLM-L6-v2"
  device: "auto"

vectorstore:
  provider: "chroma"
  persist_dir: "./storage/chroma"

generation:
  provider: "ollama"
  anthropic:
    model: "claude-sonnet-4-6"
    max_tokens: 800
    temperature: 0.0
  ollama:
    model: "llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0.0

retrieval:
  top_k: 5
  rerank: false
  rerank_top_k: 3

guardrail:
  enabled: true
  strict_mode: false